name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentalverify
          POSTGRES_PASSWORD: rentalverify
          POSTGRES_DB: rentalverify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentalverify -d rentalverify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rentalverify:rentalverify@127.0.0.1:5432/rentalverify_test
      DIRECT_URL: postgresql://rentalverify:rentalverify@127.0.0.1:5432/rentalverify_test
      AUTH_SECRET: browser-test-secret-that-is-longer-than-thirty-two-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      DEMO_MODE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test critical browser journey
        run: npm run test:e2e
